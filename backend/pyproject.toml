[project]
name = "ingressos-backend"
version = "0.1.0"
description = "API da plataforma de ingressos de cinema"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # Sem o extra [pil]: a saída SVG não precisa de Pillow, e arrastar uma
    # cadeia de bibliotecas de imagem para desenhar quadrados pretos seria
    # peso sem contrapartida. Ver R11 em specs/008-payment-ticket-issuance.
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
