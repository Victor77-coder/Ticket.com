# Front, API e Postgres no mesmo painel — Render.
# O avaliador só abre o endereço do front-end. O Django não é chamado pelo
# navegador: o Next fala com ele pela rede interna, igual ao Compose.
#
# Plano free: o serviço dorme após 15 min. A primeira abertura do dia pode
# levar cerca de um minuto. Cabe no prazo do desafio (7 dias ≪ 750 h/mês).

databases:
  - name: ticketcom-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: ticketcom-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Plano free recusa preDeployCommand. Migrate e seed vão no start.sh,
    # com o gunicorn escutando ANTES do TMDb — senão o health check mata o deploy.
    startCommand: bash start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TICKET_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticketcom-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: SITE_URL
        value: https://ticketcom-app.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ticketcom-app.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ticketcom-app.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"

  - type: web
    name: ticketcom-app
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Rede interna do Render — o navegador nunca vê este endereço.
      - key: API_BASE_URL
        value: http://ticketcom-api:10000
      - key: API_TIMEOUT_MS
        value: "60000"
